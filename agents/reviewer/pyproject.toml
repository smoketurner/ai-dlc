[project]
name = "reviewer"
version = "0.0.0"
description = "ai-dlc Reviewer agent — code-reviews each task PR (advisory)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "aws-opentelemetry-distro==0.21.0",
    "bedrock-agentcore==1.24.0",
    "boto3==1.43.107",
    "common",
    "playwright==1.63.0",
    "pydantic==2.13.5",
    "strands-agents==1.57.2",
    "structlog==26.1.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.22"]
build-backend = "uv_build"
