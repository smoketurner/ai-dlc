[project]
name = "proposer"
version = "0.0.0"
description = "ai-dlc Proposer agent — research-driven; reads issue URLs and proposes synthesis comments + optional MEMORY/prompt edits via PR."
requires-python = ">=3.14,<3.15"
dependencies = [
    "aws-opentelemetry-distro==0.19.0",
    "bedrock-agentcore==1.18.1",
    "boto3==1.43.56",
    "common",
    "playwright==1.61.0",
    "pydantic==2.13.4",
    "strands-agents==1.50.1",
    "structlog==26.1.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"
