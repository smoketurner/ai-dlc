[project]
name = "code-critic"
version = "0.0.0"
description = "ai-dlc Code-Critic agent — adversarially reviews the integrated impl PR (advisory)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "aws-opentelemetry-distro==0.19.0",
    "bedrock-agentcore==1.22.0",
    "boto3==1.43.92",
    "common",
    "playwright==1.62.0",
    "pydantic==2.13.5",
    "strands-agents==1.55.1",
    "structlog==26.1.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"
