[project]
name = "implementer"
version = "0.0.0"
description = "ai-dlc Implementer agent — works the tasks list one PR at a time."
requires-python = ">=3.14,<3.15"
dependencies = [
    "aws-opentelemetry-distro==0.19.0",
    "bedrock-agentcore==1.18.1",
    "boto3==1.43.56",
    "claude-agent-sdk==0.2.128",
    "common",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pyjwt[crypto]==2.13.0",
    # MCPClient is used (via common.gateway_tools) for the per-agent gateway
    # connection. The implementer's primary loop is Claude Agent SDK, but
    # gateway-routed S3 + GitHub ops still flow through Strands' MCP client.
    "strands-agents==1.50.1",
    "structlog==26.1.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"
