[project]
name = "dashboard"
version = "0.0.0"
description = "ai-dlc dashboard — FastAPI + Jinja2 + Alpine.js for run submission and pipeline tracking."
requires-python = ">=3.14,<3.15"
dependencies = [
    "authlib==1.8.0",
    "aws-lambda-powertools[tracer]==3.35.0",
    "boto3==1.43.107",
    "common",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "mangum==0.22.0",
    "markdown-it-py==4.2.0",
    "pydantic==2.13.5",
    "pyjwt[crypto]==2.15.1",
    "python-multipart==0.0.32",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.22"]
build-backend = "uv_build"
