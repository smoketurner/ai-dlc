[project]
name = "repo-helper"
version = "0.0.0"
description = "AgentCore Gateway tool Lambda for git/GitHub operations."
requires-python = ">=3.13,<3.15"
dependencies = [
    "aws-lambda-powertools[tracer]==3.35.0",
    "boto3==1.43.107",
    "botocore==1.43.107",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pyjwt[crypto]==2.15.1",
]

[build-system]
requires = ["uv_build>=0.12.22"]
build-backend = "uv_build"
