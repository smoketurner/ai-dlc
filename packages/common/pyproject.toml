[project]
name = "common"
version = "0.0.0"
description = "Shared models, hybrid memory, and AWS adapters for ai-dlc."
requires-python = ">=3.14,<3.15"
dependencies = [
    "bedrock-agentcore==1.18.1",
    "boto3==1.43.56",
    "botocore==1.43.56",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyjwt[crypto]==2.13.0",
    "pyyaml==6.0.3",
    "uuid-utils==0.17.0",
]

[build-system]
requires = ["uv_build>=0.11.32"]
build-backend = "uv_build"
