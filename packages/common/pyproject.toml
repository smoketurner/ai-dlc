[project]
name = "common"
version = "0.0.0"
description = "Shared models, hybrid memory, and AWS adapters for ai-dlc."
requires-python = ">=3.14,<3.15"
dependencies = [
    "bedrock-agentcore==1.24.0",
    "boto3==1.43.107",
    "botocore==1.43.107",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "pyyaml==6.0.3",
    "uuid-utils==1.0.0",
]

[build-system]
requires = ["uv_build>=0.12.22"]
build-backend = "uv_build"
